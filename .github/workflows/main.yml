name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-for-android

      - name: Build APK
        run: |
          p4a apk \
            --private . \
            --package org.pikaaapp \
            --name PikaaApp \
            --version 0.1 \
            --bootstrap sdl2 \
            --requirements python3,kivy,requests \
            --arch arm64-v8a \
            --color=always

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PikaaApp-APK
          path: "*.apk"
